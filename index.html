<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çağan Sardoğan</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .font-times {
      font-family: 'Times New Roman', Times, serif;
    }
  </style>
</head>
<body class="bg-[#fafafa] text-neutral-800 antialiased selection:bg-red-100 selection:text-red-600 min-h-screen flex items-center justify-center p-6 overflow-hidden font-times">

  <!-- ORTADA DURAN ALAN -->
  <main class="text-center select-none flex flex-col items-center">
    <button 
      id="open-btn" 
      class="group text-4xl sm:text-6xl md:text-7xl font-normal tracking-tight text-red-600 hover:text-red-700 transition-colors focus:outline-none flex items-center justify-center gap-3 cursor-pointer"
      aria-label="Menüyü aç"
    >
      <span>Çağan Sardoğan</span>
      <span class="text-xs sm:text-sm font-normal text-red-600 group-hover:translate-x-1 transition-transform tracking-normal italic">
        [click ↗]
      </span>
    </button>
    <p class="text-sm sm:text-base text-neutral-900 mt-3 tracking-widest lowercase italic font-normal">
      photographer
    </p>
  </main>

  <!-- ARKA PLAN KARARTMASI -->
  <div 
    id="overlay" 
    class="fixed inset-0 bg-neutral-900/30 backdrop-blur-xs opacity-0 pointer-events-none transition-opacity duration-300 ease-in-out z-40"
  ></div>

  <!-- YANDAN AÇILAN PANEL -->
  <aside 
    id="side-panel" 
    class="fixed top-0 right-0 h-full w-full max-w-sm bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out overflow-y-auto border-l border-neutral-100 p-8 sm:p-12 flex flex-col justify-between"
    role="dialog" 
    aria-modal="true"
  >
    <div>
      <!-- Kapatma Butonu -->
      <div class="flex justify-end pb-8">
        <button 
          id="close-btn" 
          class="text-neutral-500 hover:text-neutral-900 text-sm font-normal transition-colors p-1"
          aria-label="Kapat"
        >
          close ✕
        </button>
      </div>

      <!-- Kategori Linkleri -->
      <nav class="space-y-6 pt-4">
        <div>
          <a 
            href="#" 
            class="text-xl sm:text-2xl text-neutral-900 hover:text-red-600 transition-colors block italic"
          >
            street photography
          </a>
        </div>
        <div>
          <a 
            href="#" 
            class="text-xl sm:text-2xl text-neutral-900 hover:text-red-600 transition-colors block italic"
          >
            editorial
          </a>
        </div>
      </nav>
    </div>

    <!-- Alt Bilgi / İletişim -->
    <div class="pt-8 border-t border-neutral-100 flex flex-col gap-2 text-xs text-neutral-500">
      <div class="flex gap-4">
        <a href="https://instagram.com" target="_blank" class="hover:text-red-600 transition-colors">instagram ↗</a>
        <a href="mailto:contact@example.com" class="hover:text-red-600 transition-colors">email ↗</a>
      </div>
      <span class="mt-2 text-neutral-400">© 2026 Çağan Sardoğan</span>
    </div>
  </aside>

  <!-- JAVASCRIPT -->
  <script>
    const openBtn = document.getElementById('open-btn');
    const closeBtn = document.getElementById('close-btn');
    const panel = document.getElementById('side-panel');
    const overlay = document.getElementById('overlay');

    function openPanel() {
      panel.classList.remove('translate-x-full');
      overlay.classList.remove('opacity-0', 'pointer-events-none');
      overlay.classList.add('opacity-100');
    }

    function closePanel() {
      panel.classList.add('translate-x-full');
      overlay.classList.remove('opacity-100');
      overlay.classList.add('opacity-0', 'pointer-events-none');
    }

    openBtn.addEventListener('click', openPanel);
    closeBtn.addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePanel();
    });
  </script>
</body>
</html>
